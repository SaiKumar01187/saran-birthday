<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Saran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Marcellus&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: tender, hushed, a midnight letter.
   IDEA: a night sky over whichever country just reached midnight.
   PICTURE: a large moon drawn in its real phase for that moment, over twinkling stars.
   COLOUR and TYPE: deep indigo night, moon silver, one warm gold accent; Great Vibes for her name, Marcellus for lines, Nunito Sans for small text.
   LAYOUT: one centred poster screen: moon, name, country, moon line, quote. */
:root{color-scheme:dark;--bg:#070b1f;--ink:#eef0ff;--soft:#aab2d8;--gold:#ffd88a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 18%,#1c2357 0%,#0b1030 45%,var(--bg) 100%);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:clamp(24px,6vh,64px) 20px 48px;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.moonwrap{width:min(300px,62vw);aspect-ratio:1;position:relative;margin-bottom:8px}
.moonwrap::before{content:"";position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,190,var(--glow,.35)) 0%,rgba(255,236,190,0) 62%);animation:breathe 6s ease-in-out infinite}
.moonwrap svg{position:relative;width:100%;height:100%;display:block}
@keyframes breathe{50%{transform:scale(1.06);opacity:.8}}
.reveal{opacity:0;transform:translateY(14px);animation:rise 1.2s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
.reye{transform-box:fill-box;transform-origin:center}
#moon.winking .reye{animation:shut 1.1s ease}
#moon.winking .wlid{animation:lid 1.1s ease}
@keyframes shut{0%,100%{transform:scaleY(1)}20%,70%{transform:scaleY(0)}}
@keyframes lid{0%,100%{opacity:0}20%,70%{opacity:1}}
.hb{font-family:Marcellus,serif;letter-spacing:.04em;color:var(--soft);font-size:18px;margin:10px 0 0}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(56px,13vw,104px);line-height:1.05;margin:2px 0 4px;color:#fff;text-shadow:0 0 28px rgba(255,216,138,.45)}
.where{font-family:Marcellus,serif;font-size:clamp(20px,4.6vw,27px);margin:0;text-wrap:balance}
.where b{color:var(--gold);font-weight:400}
.moonline{margin:22px auto 0;max-width:36em;padding:16px 22px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:16px;color:var(--ink);text-wrap:balance}
.moonline small{display:block;color:var(--soft);font-size:13px;margin-top:2px}
blockquote{margin:30px auto 0;max-width:30em;font-family:Marcellus,serif;font-size:clamp(19px,3.8vw,23px);line-height:1.5;text-wrap:balance;position:relative;padding:0 8px}
blockquote::before{content:"\201C";display:block;font-family:"Great Vibes",cursive;font-size:64px;line-height:.6;color:var(--gold);opacity:.8}
.wish{margin:26px auto 0;max-width:32em;color:var(--soft);text-wrap:pretty}
.trail{margin-top:auto;padding-top:34px;font-size:13px;color:var(--soft)}
.trail b{color:var(--gold);font-weight:600}
.d1{animation-delay:.2s}.d2{animation-delay:.9s}.d3{animation-delay:1.6s}.d4{animation-delay:2.3s}.d5{animation-delay:3s}.d6{animation-delay:3.6s}
@media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none}.moonwrap::before{animation:none}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <div class="moonwrap reveal d1"><svg id="moon" viewBox="0 0 200 200" role="img" aria-label="The moon tonight"></svg></div>
  <p class="hb reveal d2">Happy birthday</p>
  <h1 class="reveal d2" id="name">Sarannnn</h1>
  <p class="where reveal d3" id="where">It's your birthday all around the world</p>
  <p class="moonline reveal d4" id="moonline"></p>
  <blockquote class="reveal d5" id="quote"></blockquote>
  <p class="wish reveal d6" id="wish"></p>
  <p class="trail reveal d6" id="trail"></p>
</main>
<script>
{
// ===== settings (the scheduler fills these in) =====
const NAME = "Sarannnn";
const BIRTHDAY = "11-28"; // "MM-DD"
const COUNTRIES = [["Afghanistan", "Asia/Kabul"], ["Albania", "Europe/Tirane"], ["Algeria", "Africa/Algiers"], ["Andorra", "Europe/Andorra"], ["Angola", "Africa/Luanda"], ["Antigua and Barbuda", "America/Antigua"], ["Argentina", "America/Argentina/Buenos_Aires"], ["Armenia", "Asia/Yerevan"], ["Australia", "Australia/Sydney"], ["Austria", "Europe/Vienna"], ["Azerbaijan", "Asia/Baku"], ["Bahamas", "America/Nassau"], ["Bahrain", "Asia/Bahrain"], ["Barbados", "America/Barbados"], ["Belarus", "Europe/Minsk"], ["Belgium", "Europe/Brussels"], ["Belize", "America/Belize"], ["Benin", "Africa/Porto-Novo"], ["Bhutan", "Asia/Thimphu"], ["Bolivia", "America/La_Paz"], ["Bosnia and Herzegovina", "Europe/Sarajevo"], ["Botswana", "Africa/Gaborone"], ["Brazil", "America/Sao_Paulo"], ["Brunei", "Asia/Brunei"], ["Bulgaria", "Europe/Sofia"], ["Burkina Faso", "Africa/Ouagadougou"], ["Burundi", "Africa/Bujumbura"], ["Cambodia", "Asia/Phnom_Penh"], ["Cameroon", "Africa/Douala"], ["Canada", "America/Toronto"], ["Cape Verde", "Atlantic/Cape_Verde"], ["Central African Republic", "Africa/Bangui"], ["Chad", "Africa/Ndjamena"], ["Chile", "America/Santiago"], ["China", "Asia/Shanghai"], ["Colombia", "America/Bogota"], ["Comoros", "Indian/Comoro"], ["Congo", "Africa/Brazzaville"], ["DR Congo", "Africa/Kinshasa"], ["Costa Rica", "America/Costa_Rica"], ["Côte d'Ivoire", "Africa/Abidjan"], ["Croatia", "Europe/Zagreb"], ["Cuba", "America/Havana"], ["Cyprus", "Asia/Nicosia"], ["Czechia", "Europe/Prague"], ["Denmark", "Europe/Copenhagen"], ["Djibouti", "Africa/Djibouti"], ["Dominica", "America/Dominica"], ["Dominican Republic", "America/Santo_Domingo"], ["Ecuador", "America/Guayaquil"], ["Egypt", "Africa/Cairo"], ["El Salvador", "America/El_Salvador"], ["Equatorial Guinea", "Africa/Malabo"], ["Eritrea", "Africa/Asmara"], ["Estonia", "Europe/Tallinn"], ["Eswatini", "Africa/Mbabane"], ["Ethiopia", "Africa/Addis_Ababa"], ["Fiji", "Pacific/Fiji"], ["Finland", "Europe/Helsinki"], ["France", "Europe/Paris"], ["Gabon", "Africa/Libreville"], ["Gambia", "Africa/Banjul"], ["Georgia", "Asia/Tbilisi"], ["Germany", "Europe/Berlin"], ["Ghana", "Africa/Accra"], ["Greece", "Europe/Athens"], ["Grenada", "America/Grenada"], ["Guatemala", "America/Guatemala"], ["Guinea", "Africa/Conakry"], ["Guinea-Bissau", "Africa/Bissau"], ["Guyana", "America/Guyana"], ["Haiti", "America/Port-au-Prince"], ["Honduras", "America/Tegucigalpa"], ["Hungary", "Europe/Budapest"], ["Iceland", "Atlantic/Reykjavik"], ["India", "Asia/Kolkata"], ["Indonesia", "Asia/Jakarta"], ["Iran", "Asia/Tehran"], ["Iraq", "Asia/Baghdad"], ["Ireland", "Europe/Dublin"], ["Israel", "Asia/Jerusalem"], ["Italy", "Europe/Rome"], ["Jamaica", "America/Jamaica"], ["Japan", "Asia/Tokyo"], ["Jordan", "Asia/Amman"], ["Kazakhstan", "Asia/Almaty"], ["Kenya", "Africa/Nairobi"], ["Kiribati", "Pacific/Kiritimati"], ["Kuwait", "Asia/Kuwait"], ["Kyrgyzstan", "Asia/Bishkek"], ["Laos", "Asia/Vientiane"], ["Latvia", "Europe/Riga"], ["Lebanon", "Asia/Beirut"], ["Lesotho", "Africa/Maseru"], ["Liberia", "Africa/Monrovia"], ["Libya", "Africa/Tripoli"], ["Liechtenstein", "Europe/Vaduz"], ["Lithuania", "Europe/Vilnius"], ["Luxembourg", "Europe/Luxembourg"], ["Madagascar", "Indian/Antananarivo"], ["Malawi", "Africa/Blantyre"], ["Malaysia", "Asia/Kuala_Lumpur"], ["Maldives", "Indian/Maldives"], ["Mali", "Africa/Bamako"], ["Malta", "Europe/Malta"], ["Marshall Islands", "Pacific/Majuro"], ["Mauritania", "Africa/Nouakchott"], ["Mauritius", "Indian/Mauritius"], ["Mexico", "America/Mexico_City"], ["Micronesia", "Pacific/Pohnpei"], ["Moldova", "Europe/Chisinau"], ["Monaco", "Europe/Monaco"], ["Mongolia", "Asia/Ulaanbaatar"], ["Montenegro", "Europe/Podgorica"], ["Morocco", "Africa/Casablanca"], ["Mozambique", "Africa/Maputo"], ["Namibia", "Africa/Windhoek"], ["Nauru", "Pacific/Nauru"], ["Nepal", "Asia/Kathmandu"], ["Netherlands", "Europe/Amsterdam"], ["New Zealand", "Pacific/Auckland"], ["Nicaragua", "America/Managua"], ["Niger", "Africa/Niamey"], ["Nigeria", "Africa/Lagos"], ["North Korea", "Asia/Pyongyang"], ["North Macedonia", "Europe/Skopje"], ["Norway", "Europe/Oslo"], ["Oman", "Asia/Muscat"], ["Palau", "Pacific/Palau"], ["Palestine", "Asia/Gaza"], ["Panama", "America/Panama"], ["Papua New Guinea", "Pacific/Port_Moresby"], ["Paraguay", "America/Asuncion"], ["Peru", "America/Lima"], ["Philippines", "Asia/Manila"], ["Poland", "Europe/Warsaw"], ["Portugal", "Europe/Lisbon"], ["Qatar", "Asia/Qatar"], ["Romania", "Europe/Bucharest"], ["Russia", "Europe/Moscow"], ["Rwanda", "Africa/Kigali"], ["Saint Kitts and Nevis", "America/St_Kitts"], ["Saint Lucia", "America/St_Lucia"], ["Saint Vincent and the Grenadines", "America/St_Vincent"], ["Samoa", "Pacific/Apia"], ["San Marino", "Europe/San_Marino"], ["São Tomé and Príncipe", "Africa/Sao_Tome"], ["Saudi Arabia", "Asia/Riyadh"], ["Senegal", "Africa/Dakar"], ["Serbia", "Europe/Belgrade"], ["Seychelles", "Indian/Mahe"], ["Sierra Leone", "Africa/Freetown"], ["Singapore", "Asia/Singapore"], ["Slovakia", "Europe/Bratislava"], ["Slovenia", "Europe/Ljubljana"], ["Solomon Islands", "Pacific/Guadalcanal"], ["Somalia", "Africa/Mogadishu"], ["South Africa", "Africa/Johannesburg"], ["South Korea", "Asia/Seoul"], ["South Sudan", "Africa/Juba"], ["Spain", "Europe/Madrid"], ["Sri Lanka", "Asia/Colombo"], ["Sudan", "Africa/Khartoum"], ["Suriname", "America/Paramaribo"], ["Sweden", "Europe/Stockholm"], ["Switzerland", "Europe/Zurich"], ["Syria", "Asia/Damascus"], ["Taiwan", "Asia/Taipei"], ["Tajikistan", "Asia/Dushanbe"], ["Tanzania", "Africa/Dar_es_Salaam"], ["Thailand", "Asia/Bangkok"], ["Timor-Leste", "Asia/Dili"], ["Togo", "Africa/Lome"], ["Tonga", "Pacific/Tongatapu"], ["Trinidad and Tobago", "America/Port_of_Spain"], ["Tunisia", "Africa/Tunis"], ["Turkey", "Europe/Istanbul"], ["Turkmenistan", "Asia/Ashgabat"], ["Tuvalu", "Pacific/Funafuti"], ["Uganda", "Africa/Kampala"], ["Ukraine", "Europe/Kyiv"], ["United Arab Emirates", "Asia/Dubai"], ["United Kingdom", "Europe/London"], ["United States", "America/New_York"], ["Uruguay", "America/Montevideo"], ["Uzbekistan", "Asia/Tashkent"], ["Vanuatu", "Pacific/Efate"], ["Vatican City", "Europe/Vatican"], ["Venezuela", "America/Caracas"], ["Vietnam", "Asia/Ho_Chi_Minh"], ["Yemen", "Asia/Aden"], ["Zambia", "Africa/Lusaka"], ["Zimbabwe", "Africa/Harare"]];
// ====================================================

const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const QUOTES = [
  "Some people light up a room. You light up whole time zones, one midnight at a time.",
  "The stars came out early tonight. They heard it was your birthday.",
  "Another trip around the sun, and somehow you still outshine it.",
  "If kindness were a constellation, it would be drawn in your shape.",
  "The world got a little brighter the day you arrived, and it has stayed that way.",
  "May this year be as warm as your laugh and as wide as your heart.",
  "Midnight is just the sky's way of saying: this day belongs to you.",
  "You make ordinary days feel like they were planned on purpose.",
  "Every candle tonight is a small sun, and every one of them is for you.",
  "Even the moon keeps coming back to see you. So will every good thing.",
  "Here's to the friend who turns plain evenings into stories worth retelling.",
  "Age is only the number of times the world got to celebrate you.",
  "The night sky has a billion stars, and it still can't do what your smile does.",
  "Wherever midnight lands today, it lands on someone lucky enough to know you.",
  "Your heart is the kind of light people find their way home by.",
  "May your wishes be bold, your year be gentle, and your cake be enormous.",
  "One more year of you is the best news the calendar has ever delivered.",
  "The universe took its time making you, and it shows.",
  "Someday the stars will ask how to shine. Tell them to watch you.",
  "Today the whole planet takes turns saying your name."
];
const WISHES = [
  "May this year bring you calm mornings, big adventures and people who love you loudly.",
  "Wishing you a year full of good surprises, easy laughs and dreams that actually come true.",
  "May every place you go feel like home and every person you meet feel like a friend.",
  "Here's to health, happiness and all the little moments that make life sweet."
];

const hash = decodeURIComponent(location.hash.slice(1)).toLowerCase();
const idx = COUNTRIES.findIndex(c => slug(c[0]) === hash);
const country = idx >= 0 ? COUNTRIES[idx] : null;

// offset (minutes) of a time zone at a moment
function tzOffset(tz, date){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(date);
  const g = t => +p.find(x=>x.type===t).value;
  return (Date.UTC(g("year"),g("month")-1,g("day"),g("hour"),g("minute"),g("second")) - date.getTime())/60000;
}
// the UTC moment of local midnight on a given date in a time zone
function localMidnight(tz, y, m, d){
  let t = Date.UTC(y,m-1,d);
  return new Date(t - tzOffset(tz,new Date(t - tzOffset(tz,new Date(t))*60000))*60000);
}

// moment we describe: local birthday midnight in that country (this year's), else now
let moment = new Date();
const bd = /^(\d\d)-(\d\d)$/.exec(BIRTHDAY);
if (country && bd){
  const now = new Date();
  let y = now.getUTCFullYear();
  let mid = localMidnight(country[1], y, +bd[1], +bd[2]);
  if (now - mid > 200*864e5) mid = localMidnight(country[1], y+1, +bd[1], +bd[2]);
  if (mid - now > 165*864e5) mid = localMidnight(country[1], y-1, +bd[1], +bd[2]);
  moment = mid;
}

// moon phase: fraction of the synodic month since a known new moon
const SYN = 29.530588853;
const age = (((moment.getTime() - Date.UTC(2000,0,6,18,14))/864e5) % SYN + SYN) % SYN;
const phase = age / SYN;                       // 0 new, .5 full
const lit = (1 - Math.cos(2*Math.PI*phase))/2; // illuminated fraction
const waxing = phase < .5;
const full = lit >= 0.97;

// draw the moon
{
  const R = 92, C = 100;
  const rx = Math.max(R*Math.abs(1-2*lit), .01);
  const termSweep = lit < .5 ? 0 : 1;
  const litPath = `M${C},${C-R} A${R},${R} 0 0 1 ${C},${C+R} A${rx},${R} 0 0 ${termSweep} ${C},${C-R}Z`;
  const flip = waxing ? "" : `transform="translate(200,0) scale(-1,1)"`;
  const craters = [[58,62,10],[146,66,8],[150,140,11],[52,132,8],[104,168,7],[128,44,5]]
    .map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#c9c2ad" opacity=".55"/><circle cx="${x-r*.18}" cy="${y-r*.18}" r="${r*.78}" fill="#e2dccb" opacity=".5"/>`).join("");
  document.getElementById("moon").innerHTML = `
  <defs>
    <radialGradient id="mg" cx="40%" cy="36%" r="70%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".65" stop-color="#ece6d4"/><stop offset="1" stop-color="#c8c0a8"/></radialGradient>
    <clipPath id="lit"><path d="${litPath}" ${flip}/></clipPath>
  </defs>
  <circle cx="${C}" cy="${C}" r="${R}" fill="#1d2448"/>
  <circle cx="${C}" cy="${C}" r="${R}" fill="#2a3263" opacity=".55"/>
  <g clip-path="url(#lit)"><circle cx="${C}" cy="${C}" r="${R}" fill="url(#mg)"/>${craters}
    <g class="face" fill="none" stroke="#6f6857" stroke-width="3.2" stroke-linecap="round">
      <ellipse cx="80" cy="94" rx="4.6" ry="6.4" fill="#6f6857" stroke="none"/>
      <g class="reye"><ellipse cx="120" cy="94" rx="4.6" ry="6.4" fill="#6f6857" stroke="none"/></g>
      <path class="wlid" d="M113,95 Q120,99 127,95" opacity="0"/>
      <path d="M84,120 Q100,133 116,120"/>
      <circle cx="68" cy="112" r="7" fill="#f2a7a0" opacity=".35" stroke="none"/>
      <circle cx="132" cy="112" r="7" fill="#f2a7a0" opacity=".35" stroke="none"/>
    </g></g>`;
  const mv = document.getElementById("moon");
  const wink = () => { mv.classList.remove("winking"); void mv.getBoundingClientRect(); mv.classList.add("winking"); };
  setTimeout(wink, 2200);
  mv.addEventListener("click", wink);
  mv.style.cursor = "pointer";
  document.querySelector(".moonwrap").style.setProperty("--glow", (.12 + lit*.38).toFixed(2));
}

// words
const nm = NAME && !NAME.startsWith("__") ? NAME : "Sarannnn";
document.getElementById("name").textContent = nm;
const pct = Math.round(lit*100);
const ml = document.getElementById("moonline");
const place = country ? country[0] : "the world";
if (country) document.getElementById("where").innerHTML = "It's your birthday in <b></b>", document.querySelector("#where b").textContent = country[0];
const STORIES = {
"kiribati": "Kiribati is the first place on Earth to reach your birthday, and its island navigators once crossed open ocean by reading the moon and stars. Today the whole Pacific can steer by you instead.",
"new-zealand": "Māori planned planting, fishing and feasts by the maramataka, the lunar calendar. The moon set the rhythm of their year; you set the rhythm of every room you walk into.",
"fiji": "In Fiji, people watch the moon to find the one night a year the balolo rise from the reef, a rare feast everyone waits for. That's you: the night everyone waits for.",
"australia": "The Yolŋu people of northern Australia knew long ago that the moon pulls the tides. The moon moves oceans; you move everyone around you.",

"nepal": "In Nepal, festivals like Dashain and Tihar, and every Purnima full-moon day, are timed by the lunar calendar. Good days are counted by the moon. Your birthday never needed the moon's permission to be the best day of the year.",
"india": "On Sharad Purnima, families in India leave kheer out under the moonlight, believing it makes it sweeter. This year India gets something even sweeter under its moon: you, home from America just in time for your birthday.",
"kazakhstan": "From Baikonur in Kazakhstan, the Luna rockets launched toward the moon and became the first human-made things ever to reach it. People spent centuries trying to reach the moon. Reaching you is easier, and so much better.",
"afghanistan": "In Afghanistan, families wait to spot the new crescent before Eid begins, the night the sky tells everyone it's time for joy. Tonight the sky's message is simpler: it's your birthday.",
"united-arab-emirates": "In the UAE, a moon-sighting committee watches the sky for the thin crescent that starts Ramadan and Eid. Everyone looks up, waiting for one small light that changes everything. That's what you are to the people who love you.",

"mexico": "Near Mexico City, the Pyramid of the Moon at Teotihuacan has stood for almost two thousand years, and the Aztecs sang of Coyolxauhqui, goddess of the moon. Mexico is the last stop tonight, and the sky saved the best story for the end: you."
};
const PARTLY = [
  p => `The moon is only partly visible over ${p} tonight. Maybe it needs you to feel whole.`,
  p => `Only part of the moon is showing over ${p} tonight. The rest of the light is in your smile.`,
  p => `The moon over ${p} is a little shy tonight, half hidden. It heard whose birthday it is.`,
  p => `${p}'s moon is only partly lit tonight. Turns out the sky borrows its glow from you.`,
  p => `A piece of the moon is missing over ${p} tonight. It's looking for you.`
];
const FULLY = [
  p => `The moon is fully shining over ${p} tonight, but it's still not as bright as you.`,
  p => `A full moon over ${p} tonight, all dressed up for your birthday, and still only the second brightest thing.`,
  p => `Full moon over ${p}. Beautiful, but it knows it isn't the main event.`
];
const line = document.createElement("span");
const key = country ? slug(country[0]) : "";
const pick = (arr) => arr[(idx >= 0 ? idx : 0) % arr.length](place);
line.textContent = (!full && STORIES[key]) ? STORIES[key] : pick(full ? FULLY : PARTLY);
ml.append(line);

const qi = idx >= 0 ? idx % QUOTES.length : Math.floor(Math.random()*QUOTES.length);
document.getElementById("quote").append(QUOTES[qi]);
document.getElementById("wish").textContent = WISHES[(idx>=0?idx:qi) % WISHES.length];

// how many countries have already reached the birthday
if (bd){
  const now = new Date();
  let done = 0;
  for (const [,tz] of COUNTRIES){
    const p = new Intl.DateTimeFormat("en-CA",{timeZone:tz,month:"2-digit",day:"2-digit"}).format(now);
    if (p === `${bd[1]}-${bd[2]}`) done++;
  }
  const tr = document.getElementById("trail");
  if (done) { tr.innerHTML = "<b></b> of " + COUNTRIES.length + " countries are celebrating your birthday right now"; tr.querySelector("b").textContent = done; }
}

// starry sky
{
  const cv = document.getElementById("sky"), cx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, stars = [], shoot = null;
  const size = () => {
    const dpr = Math.min(devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    stars = Array.from({length: Math.round(W*H/2600)}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.3+.2, p:Math.random()*6.28, s:.4+Math.random()*1.6, w:Math.random()<.12}));
  };
  const frame = t => {
    cx.clearRect(0,0,W,H);
    for (const s of stars){
      const a = still ? .7 : .35 + .65*Math.abs(Math.sin(s.p + t/1000*s.s));
      cx.globalAlpha = a; cx.fillStyle = s.w ? "#ffe7b5" : "#ffffff";
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
      if (s.r > 1.25){ cx.globalAlpha = a*.35; cx.fillRect(s.x-4*s.r, s.y-.4, 8*s.r, .8); cx.fillRect(s.x-.4, s.y-4*s.r, .8, 8*s.r); }
    }
    if (!still){
      if (!shoot && Math.random() < .004) shoot = {x:Math.random()*W*.8, y:Math.random()*H*.4, l:0};
      if (shoot){
        shoot.l += 9; const x = shoot.x + shoot.l, y = shoot.y + shoot.l*.45;
        const g = cx.createLinearGradient(x-120, y-54, x, y); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(255,255,255,.9)");
        cx.globalAlpha = Math.max(0, 1 - shoot.l/500); cx.strokeStyle = g; cx.lineWidth = 1.6;
        cx.beginPath(); cx.moveTo(x-120, y-54); cx.lineTo(x, y); cx.stroke();
        if (shoot.l > 500) shoot = null;
      }
      requestAnimationFrame(frame);
    }
    cx.globalAlpha = 1;
  };
  const ro = new ResizeObserver(size); ro.observe(document.body); size(); requestAnimationFrame(frame);
}
addEventListener("hashchange", () => location.reload());
}
